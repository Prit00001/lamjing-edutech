services:
  postgres:
    image: postgres:18
    container_name: lamjing-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: lamjing
      POSTGRES_USER: lamjing_user
      POSTGRES_PASSWORD: lamjing_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: